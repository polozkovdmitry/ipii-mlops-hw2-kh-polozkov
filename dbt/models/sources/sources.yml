version: 2

sources:
  - name: raw
    description: >
      Raw card transactions loaded into ClickHouse in hw2 (CSV -> Kafka -> MergeTree,
      or directly from CSV via `make load`). The task calls this table
      `transactions_db.transactions`; in this project it lives in the `hw2` database.
    schema: hw2
    tables:
      - name: transactions
        description: One row per card transaction, with a fraud label (`target`).
        columns:
          - name: transaction_time
            description: Transaction timestamp (minute precision).
            data_tests:
              - not_null
          - name: merch
            description: Merchant name. Every value carries a synthetic `fraud_` prefix from the dataset generator; it does not mean fraud.
            data_tests:
              - not_null
          - name: cat_id
            description: Merchant category (14 values).
            data_tests:
              - not_null
          - name: amount
            description: Transaction amount, USD.
            data_tests:
              - not_null
          - name: name_1
            description: Cardholder first name.
          - name: name_2
            description: Cardholder last name.
          - name: gender
            description: Cardholder gender.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["M", "F"]
          - name: street
            description: Cardholder street address.
          - name: one_city
            description: Cardholder city.
          - name: us_state
            description: Cardholder state, two-letter code.
            data_tests:
              - not_null
          - name: post_code
            description: Cardholder ZIP code.
          - name: lat
            description: Cardholder latitude.
          - name: lon
            description: Cardholder longitude.
          - name: population_city
            description: Population of the cardholder's city.
          - name: jobs
            description: Cardholder occupation.
          - name: merchant_lat
            description: Merchant latitude.
          - name: merchant_lon
            description: Merchant longitude.
          - name: target
            description: Fraud label, 1 = fraudulent transaction.
            data_tests:
              - accepted_values:
                  arguments:
                    values: [0, 1]
                    quote: false
