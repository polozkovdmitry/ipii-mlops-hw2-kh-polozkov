apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 1s   # = scrape_interval, чтобы $__rate_interval не был слишком большим

  # срез по скорам из таблицы scores (её пишет scoring_writer)
  - name: PostgreSQL
    uid: postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: $POSTGRES_USER
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: $POSTGRES_PASSWORD
