global:
  # короткий интервал, чтобы графики в Grafana обновлялись сразу
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: fraud_detector
    static_configs:
      - targets: ['fraud_detector:8000']

  - job_name: scoring_writer
    static_configs:
      - targets: ['scoring_writer:8001']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
